services:
  autopm3:
    build: .
    ports:
      - "8501:8501"
    environment:
      # DeepSeek page defaults
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # OpenAI Compatible page defaults
      - OPENAI_API_URL=${OPENAI_API_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Mount secrets for local development
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped
